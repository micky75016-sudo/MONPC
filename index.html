<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bookmark OS</title>
    <link rel="stylesheet" href="style.css"> <!-- Assurez-vous que le nom du CSS correspond -->
</head>
<body>

    <!-- Barre de menu supérieure (Top Bar) -->
    <header id="topBar">
        <div class="menu-left">
            <span class="logo">✦ Bookmark OS</span>
            <button id="mbAllApps" onclick="openAllBookmarks()">All Bookmarks</button>
            <button id="mbImport">Import</button>
            <button id="mbExport">Export</button>
            <button id="mbRestore">Restore</button>
            <button id="mbAddIcon">Add Icon</button>
            
            <!-- NOUVEAU BOUTON : Ajout du dossier sur le bureau -->
            <button id="mbAddFolder" onclick="addDesktopFolder('Nouveau Dossier')">Add Folder</button>
            
            <button id="mbEdit" onclick="desktopEditing ? exitDesktopEdit() : enterDesktopEdit()">Edit Desktop</button>
        </div>
        <div class="menu-right">
            <span id="clock">--:--</span>
        </div>
    </header>

    <!-- Zone principale du Bureau (Desktop) -->
    <main id="desktop">
        <!-- Grille contenant les icônes et les dossiers -->
        <div id="desktopGrid">
            <!-- Les éléments (liens et dossiers) sont injectés ici par renderDesktopIcons() -->
        </div>
    </main>

    <!-- Zone du Dock (Barre d'applications inférieure) -->
    <footer id="dockContainer">
        <div id="dock">
            <!-- Les icônes du dock sont injectées ici par renderDock() -->
        </div>
    </footer>

    <!-- Section d'affichage des Favoris (All Bookmarks Modal/Panel) -->
    <div id="allBookmarksPanel" style="display: none;">
        <h2>All Bookmarks</h2>
        <button onclick="exitAllBookmarks()">Cancel</button>
        <p>Tap any bookmark to add it to the home screen</p>
        <div id="bookmarksList"></div>
    </div>

    <!-- Chargement des scripts JavaScript -->
    <script src="desktop.js"></script> <!-- Contient le code avec la gestion des dossiers -->
</body>
</html>
